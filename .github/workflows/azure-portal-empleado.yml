name: Desplegar portal del empleado
on:
  push:
    branches: [portal-acceso-seguro]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar portal en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PORTAL_XP }}
          action: upload
          app_location: /
          api_location: ''
          output_location: ''
          skip_app_build: true
